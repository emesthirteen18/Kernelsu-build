name: Build KernelSU Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Nothing Kernel Source
      uses: actions/checkout@v4
      with:
        repository: 'NothingOSS/android_kernel_msm-6.6_nothing_sm7750'
        path: 'kernel_source'
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev libelf-dev python3 unzip curl wget device-tree-compiler aria2

    - name: Download and Extract Prebuilt Clang Toolchain
      run: |
        mkdir -p ~/clang_download
        cd ~/clang_download
        # Download the full android14-release branch archive
        aria2c -x 16 -s 16 -k 1M -o android14-release.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release.tar.gz"
        # Extract the entire archive
        tar -xzf android14-release.tar.gz -C .
        # Move the specific clang version to the expected location
        mkdir -p ~/clang
        mv clang-r510928/* ~/clang/
        cd ~/clang
        rm -rf ~/clang_download

    - name: Integrate BakaSU
      working-directory: ./kernel_source
      run: |
        curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

    - name: Compile the Module
      working-directory: ./kernel_source
      run: |
        export PATH=~/clang/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # Configure the kernel for module building
        make gki_defconfig || make vendor/sm7750-perf_defconfig || make defconfig || true
        
        scripts/config --enable CONFIG_MODULES
        scripts/config --enable CONFIG_KSU
        scripts/config --set-val CONFIG_KSU m
        
        # Build the module
        make -j$(nproc) modules

    - name: Upload Compiling Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernelsu-module
        path: kernel_source/drivers/kernelsu/kernelsu.ko
