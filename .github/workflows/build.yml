name: Build KernelSU Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Nothing Kernel Source
      uses: actions/checkout@v4
      with:
        repository: 'NothingOSS/android_kernel_msm-6.6_nothing_sm7750'
        path: 'kernel_source'
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev libelf-dev python3 unzip curl wget device-tree-compiler aria2 lld clang llvm

    - name: Sparse Clone Prebuilt Clang Toolchain (r510928)
      run: |
        mkdir -p $HOME/clang
        cd $HOME/clang
        git init
        git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
        git config core.sparseCheckout true
        echo "clang-r510928/*" >> .git/info/sparse-checkout
        git fetch --depth=1 origin master
        git checkout master
        ls -l $HOME/clang/clang-r510928/bin/ld.lld || echo "ld.lld missing from prebuilt"

    - name: Integrate BakaSU
      working-directory: ./kernel_source
      run: |
        curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

    - name: Compile the Module (Fast Targeted LKM Build)
      working-directory: ./kernel_source
      run: |
        if [ -x "$HOME/clang/clang-r510928/bin/clang" ] && [ -x "$HOME/clang/clang-r510928/bin/ld.lld" ]; then
          export PATH="$HOME/clang/clang-r510928/bin:$PATH"
        else
          export PATH="/usr/bin:$PATH"
        fi

        export ARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        export READELF=llvm-readelf
        export HOSTCC=clang
        export HOSTLD=ld.lld

        # 1. Force exact vermagic localversion (Qwen's fix)
        echo "=== Creating .scmversion ==="
        echo "-android15-8-g1a9b880d342b-ab15218529-4k" > .scmversion

        # 2. Kill the duplicate DECLARE_HOOK in include/trace/hooks/blk.h
        echo "=== Removing duplicate hook ==="
        sed -i '51,54d' include/trace/hooks/blk.h
        awk '!seen[$0]++ || !/EXPORT_TRACEPOINT_SYMBOL_GPL\(android_vh_bio_add_page_merge_bypass\)/' \
          drivers/android/vendor_hooks.c > drivers/android/vendor_hooks.c.tmp && \
          mv drivers/android/vendor_hooks.c.tmp drivers/android/vendor_hooks.c

        # 3. Generate base GKI config and merge Nothing Phone (4a) Pro vendor fragment
        make gki_defconfig
        scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/FroggerPro.config

        # 4. Configure BakaSU as a loadable module (m) and disable LTO
        scripts/config --enable CONFIG_MODULES
        scripts/config --set-val CONFIG_KSU m
        scripts/config --disable CONFIG_LOCALVERSION_AUTO
        scripts/config --set-str CONFIG_LOCALVERSION ""
        scripts/config -d LTO_CLANG -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO

        # 5. Synchronize Kconfig dependencies
        make -j$(nproc) olddefconfig

        # 6. Prepare headers/scripts for external module compilation
        make -j$(nproc) modules_prepare

        # 7. Generate SELinux flask.h and av_permissions.h required by BakaSU
        make -j$(nproc) security/selinux/built-in.a

        # 8. Compile ONLY the BakaSU/KernelSU module directory
        echo "=== Building targeted module ==="
        KSU_DIR=$(realpath drivers/kernelsu)
        make -j$(nproc) M="$KSU_DIR" src="$KSU_DIR" \
          CONFIG_KSU=m \
          KBUILD_MODPOST_WARN=1 \
          modules

        # 9. Strip debug symbols
        llvm-strip -d "$KSU_DIR/kernelsu.ko" || true
        ls -lh "$KSU_DIR/kernelsu.ko"

        # 10. Verification (Qwen's checklist)
        echo "=== VERMAGIC CHECK ==="
        modinfo -F vermagic "$KSU_DIR/kernelsu.ko"
        echo "=== VERSIONS SECTION CHECK ==="
        readelf -S "$KSU_DIR/kernelsu.ko" | grep "__versions" || echo "no __versions section (Good for ksud)"
        echo "=== SHN_UNDEF SYMBOLS CHECK ==="
        readelf -s "$KSU_DIR/kernelsu.ko" | grep UND | head -n 5

    - name: Upload Compiling Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernelsu-module
        path: kernel_source/drivers/kernelsu/kernelsu.ko