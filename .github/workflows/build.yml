name: Build BakaSU Late-Load All-In-One (NothingOSS SM7750)

"on":
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bakasu_ref:
        description: 'BakaSU tag/branch override (leave empty for auto-latest)'
        required: false
        default: ''

env:
  ARCH: arm64
  CLANG_REVISION: r510928
  KMI_GENERATION: android15-6.6

jobs:
  build-kernelsu-lkm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 12288
          temp-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout user repo (e-r20, spray, stock.ko)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: workspace-repo

      - name: Checkout Nothing Kernel Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: 'NothingOSS/android_kernel_msm-6.6_nothing_sm7750'
          ref: 'sm7750/b/FroggerPro'
          path: 'kernel_source'
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc bison flex libssl-dev libelf-dev \
            python3 unzip curl wget device-tree-compiler aria2 pahole cpio zip zstd jq

      - name: Download Prebuilt Clang Toolchain (r510928)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          URL="https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip"
          curl -L -f --max-time 600 --retry 3 --retry-delay 5 -o clang.zip "$URL"
          mkdir -p clang-r510928
          unzip -q clang.zip -d clang-r510928 || true
          if [ -d clang-r510928/clang-r510928 ]; then
            mv clang-r510928/clang-r510928/* clang-r510928/ || true
            rmdir clang-r510928/clang-r510928 || true
          fi
          rm -rf clang-r510928/runtimes_ndk_cxx || true
          rm -f clang.zip
          test -x "$HOME/clang/clang-r510928/bin/clang" || exit 1
          echo "$HOME/clang/clang-r510928/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Resolve Latest BakaSU Release Tag
        id: bakasu_version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ github.event.inputs.bakasu_ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_REF}" ]; then
            BAKASU_REF="${INPUT_REF}"
          else
            BAKASU_REF=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/Baka-SU/BakaSU/releases?per_page=1" \
              | jq -r '.[0].tag_name // empty')
            if [ -z "\( {BAKASU_REF}" ] || [ " \){BAKASU_REF}" = "null" ]; then
              BAKASU_REF=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/Baka-SU/BakaSU/tags?per_page=1" \
                | jq -r '.[0].name // "main"')
            fi
          fi
          echo "BAKASU_REF=${BAKASU_REF}" >> "$GITHUB_ENV"
          echo "Resolved BakaSU ref: ${BAKASU_REF}"

      - name: Download ksud and Manager APK from Release
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifact_bundle"
          
          ASSETS=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/Baka-SU/BakaSU/releases/tags/${BAKASU_REF}" || echo "{}")
          
          KSUD_URL=$(echo "$ASSETS" | jq -r '.assets[]? | select(.name | contains("ksud-aarch64-linux-android")) | .browser_download_url' | head -n1)
          if [ -n "$KSUD_URL" ] && [ "$KSUD_URL" != "null" ]; then
            curl -L -o "$GITHUB_WORKSPACE/artifact_bundle/ksud" "$KSUD_URL"
            chmod +x "$GITHUB_WORKSPACE/artifact_bundle/ksud"
          else
            echo "Warning: Could not find ksud in release assets"
          fi

          MGR_URL=$(echo "$ASSETS" | jq -r '.assets[]? | select(.name | contains("Manager-release.zip")) | .browser_download_url' | head -n1)
          if [ -n "$MGR_URL" ] && [ "$MGR_URL" != "null" ]; then
            curl -L -o /tmp/manager.zip "$MGR_URL"
            unzip -o -j /tmp/manager.zip "BakaSU_*_arm64-v8a-release.apk" -d "$GITHUB_WORKSPACE/artifact_bundle/" || true
          else
            echo "Warning: Could not find Manager APK in release assets"
          fi

      - name: Integrate BakaSU & Enforce CONFIG_KSU_DEBUG
        working-directory: ./kernel_source
        run: |
          set -euo pipefail
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_REF}/kernel/setup.sh" \
            | bash -s "${BAKASU_REF}"

          KBUILD_FILE=$(find KernelSU/ drivers/kernelsu/ -maxdepth 2 \( -name "Kbuild" -o -name "Makefile" \) 2>/dev/null | head -n1)
          [ -n "${KBUILD_FILE}" ] || { echo "FATAL: BakaSU Kbuild not found"; exit 1; }
          
          cat << 'KBUILD_EOF' >> "${KBUILD_FILE}"
          CONFIG_KSU := m
          CONFIG_KSU_DEBUG := y
          ccflags-y += -DCONFIG_KSU_DEBUG=1 -DCONFIG_KSU_SAFE_LATE_LOAD=1
          KBUILD_EOF

          cat << 'DEFCONFIG_EOF' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=m
          CONFIG_KSU_DEBUG=y
          DEFCONFIG_EOF

      - name: Apply SAFE_LATE_LOAD Patch and ABI Fixes
        working-directory: ./kernel_source
        run: |
          set -euo pipefail
          INIT_C=$(find . -name init.c -path '*/KernelSU/kernel/core/*' | head -n1)
          [ -n "$INIT_C" ] || { echo "ERROR: init.c not found"; exit 1; }
          
          python3 - "$INIT_C" <<'PY_PATCH_INIT'
          import re, sys, pathlib

          p = pathlib.Path(sys.argv[1])
          text = p.read_text()

          # Locate the exact function span of kernelsu_init / ksu_init via brace counting
          fn_match = re.search(r'int\s+__init\s+(?:kernelsu_init|ksu_init)\s*\([^)]*\)\s*\{', text)
          assert fn_match, "FATAL: kernelsu_init/ksu_init signature not found in init.c"

          open_brace = text.find('{', fn_match.start())
          depth = 0
          close_brace = -1
          for idx in range(open_brace, len(text)):
              ch = text[idx]
              if ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      close_brace = idx
                      break
          assert close_brace != -1, "FATAL: unmatched braces in kernelsu_init/ksu_init"

          fn_body = text[open_brace + 1:close_brace]

          # Jump past rules/cred/escape/hook/setenforce after the late-load kprobe skip.
          # safe_late_done does not exist in BakaSU v4.2.0-rc3 init.c; it is inserted below.
          boot_line = "\n\t\tksu_boot_completed = true;" if "ksu_boot_completed" in text else ""
          anchor1_pat = re.compile(
              r'(pr_info\s*\(\s*[^;]*?"[^"]*late load mode, skipping kprobe hooks\\n"\s*\)\s*;)'
          )
          fn_body, n1 = anchor1_pat.subn(
              lambda m: (
                  m.group(1)
                  + '\n\t\tpr_info("SAFE_LATE_LOAD: skipping rules/cred/escape/hook init\\n");'
                  + '\n\t\tpr_info("%s\\n", safe_late_load_marker);'
                  + boot_line
                  + '\n\t\tgoto safe_late_done;'
              ),
              fn_body,
              count=1
          )
          assert n1 == 1, f"FATAL: anchor1 failed inside init function (n1={n1})"

          # Insert safe_late_done immediately before the FINAL return 0; of this function
          ret_matches = list(re.finditer(r'\n([ \t]*)return\s+0\s*;', fn_body))
          assert ret_matches, "FATAL: no return 0; found inside kernelsu_init/ksu_init"
          last_ret = ret_matches[-1]
          indent = last_ret.group(1)
          fn_body = (
              "\n\t(void)safe_late_load_marker;"
              + fn_body[:last_ret.start()]
              + f"\nsafe_late_done:\n{indent};"
              + fn_body[last_ret.start():]
          )

          global_marker = (
              '\nconst char __used __attribute__((used, section(".rodata"))) safe_late_load_marker[] = '
              '"SAFE_LATE_LOAD: skipping rules/cred/escape/hook init";\n\n'
          )
          text = (
              text[:fn_match.start()]
              + global_marker
              + text[fn_match.start():open_brace + 1]
              + fn_body
              + text[close_brace:]
          )
          assert 'goto safe_late_done;' in text, "FATAL: goto safe_late_done; missing after patch"
          assert 'pr_info("SAFE_LATE_LOAD: skipping rules/cred/escape/hook init\\n");' in text
          p.write_text(text)
          PY_PATCH_INIT

          # Fail-fast: the skip must be a real jump, not just a marker string
          if ! grep -Fq 'goto safe_late_done;' "$INIT_C"; then
            echo "FATAL: SAFE_LATE_LOAD regression: init.c is missing 'goto safe_late_done;'"
            exit 1
          fi
          if ! grep -Fq "safe_late_done:" "$INIT_C"; then
            echo "FATAL: SAFE_LATE_LOAD regression: init.c is missing label safe_late_done:"
            exit 1
          fi
          echo "PASS: SAFE_LATE_LOAD skip is present (goto safe_late_done;)"


          python3 - << 'PY_PATCH_ABI'
          import re, sys
          def patch(path, pat, repl, desc):
              with open(path) as f: c = f.read()
              n = re.subn(pat, repl, c)
              if n[1] == 0: sys.exit(f"FAILED: {desc}")
              with open(path, 'w') as f: f.write(n[0])
          patch("arch/arm64/include/asm/alternative-macros.h", r'ALTERNATIVE_CB\([\s\\]*"b\s*%l\[l_no\]"[\s\\]*,[\s\\]*%\[cpucap\][\s\\]*,[\s\\]*alt_cb_patch_nops[\s\\]*\)', 'ALTERNATIVE("b %l[l_no]", "nop", %[cpucap])', "alt")
          patch("arch/arm64/include/asm/barrier.h", r'ALTERNATIVE_CB\([\s\\]*"dsb sy"[\s\\]*,[\s\\]*ARM64_HAS_GIC_PRIO_RELAXED_SYNC[\s\\]*,[\s\\]*alt_cb_patch_nops[\s\\]*\)', 'ALTERNATIVE("dsb sy", "nop", ARM64_HAS_GIC_PRIO_RELAXED_SYNC)', "barrier")
          patch("include/linux/jump_label.h", r'static __always_inline bool static_key_false\(struct static_key \*key\)\s*\{\s*return arch_static_branch\(key, false\);\s*\}', 'static __always_inline bool static_key_false(struct static_key *key) { return unlikely(READ_ONCE(key->enabled.counter) > 0); }', "false")
          patch("include/linux/jump_label.h", r'static __always_inline bool static_key_true\(struct static_key \*key\)\s*\{\s*return !arch_static_branch\(key, true\);\s*\}', 'static __always_inline bool static_key_true(struct static_key *key) { return likely(READ_ONCE(key->enabled.counter) > 0); }', "true")
          PY_PATCH_ABI

          LIBBPF="tools/lib/bpf/libbpf.c"
          [ -f "$LIBBPF" ] && sed -i 's/char \*next_path;/const char *next_path;/' "$LIBBPF" || true
          echo "HOSTCFLAGS=-Wno-error=incompatible-pointer-types-discards-qualifiers" >> "$GITHUB_ENV"

      - name: Compile Module
        working-directory: ./kernel_source
        run: |
          set -euo pipefail
          export ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld
          export AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
          export STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTLD=ld.lld
          export HOSTCFLAGS="-Wno-error=incompatible-pointer-types-discards-qualifiers"
          export KBUILD_MODPOST_WARN=1
          COMMON="-Wno-array-bounds -Wno-error=array-bounds -Wno-unreachable-code -Wno-unused-label -Wno-unused-function"

          echo "-android15-8-g1a9b880d342b-ab15218529-4k" > .scmversion
          sed -i '51,54d' include/trace/hooks/blk.h
          awk '!seen[$0]++ || !/EXPORT_TRACEPOINT_SYMBOL_GPL\(android_vh_bio_add_page_merge_bypass\)/' \
            drivers/android/vendor_hooks.c > drivers/android/vendor_hooks.c.tmp && mv drivers/android/vendor_hooks.c.tmp drivers/android/vendor_hooks.c

          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/FroggerPro.config
          scripts/config --enable CONFIG_MODULES --enable CONFIG_MODULE_UNLOAD
          scripts/config --disable CONFIG_MODULE_SIG --disable CONFIG_MODULE_SIG_FORCE --disable CONFIG_WERROR
          scripts/config --module CONFIG_KSU
          scripts/config --enable CONFIG_KSU_DEBUG
          scripts/config --disable CONFIG_LOCALVERSION_AUTO
          scripts/config --set-str CONFIG_LOCALVERSION ""

          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare KCFLAGS="$COMMON"
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 security/selinux/built-in.a KCFLAGS="$COMMON"
          touch Module.symvers

          KSU_DIR=$(realpath drivers/kernelsu)
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 M="$KSU_DIR" clean
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            M="$KSU_DIR" src="$KSU_DIR" CONFIG_KSU=m CONFIG_KSU_DEBUG=y \
            KCFLAGS="$COMMON -DCONFIG_KSU_SAFE_LATE_LOAD=1 -DCONFIG_KSU_DEBUG=1" \
            CFLAGS_MODULE="-mcmodel=large $COMMON -DCONFIG_KSU_SAFE_LATE_LOAD=1 -DCONFIG_KSU_DEBUG=1" \
            KBUILD_MODPOST_WARN=1 modules

          KO=$(find "$KSU_DIR" -maxdepth 2 -name "kernelsu*.ko" | head -n1)
          cp "$KO" "$GITHUB_WORKSPACE/artifact_bundle/kernelsu.ko"

      - name: Verify Module
        run: |
          set -euo pipefail
          KO="$GITHUB_WORKSPACE/artifact_bundle/kernelsu.ko"
          if ! llvm-nm "$KO" | grep -qE "ksu_debug_manager_appid|ksu_debug_manager_uid"; then
            echo "FATAL: CONFIG_KSU_DEBUG symbols missing"; exit 1
          fi
          if llvm-readelf -r "$KO" | grep -qE "R_AARCH64_JUMP_SLOT|R_AARCH64_GLOB_DAT"; then
            echo "FATAL: forbidden GOT/PLT relocations"; exit 1
          fi
          echo "PASS: module verified"

      - name: Generate patch_final.py (Fixed SHN_ABS Binder)
        run: |
          set -euo pipefail
          cat << 'PATCH_FINAL_PY' > "$GITHUB_WORKSPACE/artifact_bundle/patch_final.py"
          import struct, sys

          ko_path = '/data/local/tmp/kernelsu_base.ko'
          stock_ko = '/data/local/tmp/stock.ko'
          kallsyms_path = '/data/local/tmp/kallsyms.txt'

          SHT_SYMTAB = 2
          SHN_ABS = 0xfff1
          SHN_UNDEF = 0
          GLOBAL_TYPES = {'T','D','R','B','V','W'}

          kallsyms = {}; kallsyms_is_global = {}
          with open(kallsyms_path) as f:
              for line in f:
                  parts = line.strip().split()
                  if len(parts) >= 3:
                      addr = int(parts[0], 16); sym_type = parts[1]; raw_name = parts[2]
                      base_name = raw_name.split('.llvm.')[0]; is_glob = sym_type in GLOBAL_TYPES
                      for c in (raw_name, base_name):
                          if c not in kallsyms or (is_glob and not kallsyms_is_global.get(c, False)):
                              kallsyms[c] = addr; kallsyms_is_global[c] = is_glob

          with open(stock_ko, 'rb') as f: stock_buf = f.read()
          s_shoff = struct.unpack('<Q', stock_buf[0x28:0x30])[0]
          s_shentsize = struct.unpack('<H', stock_buf[0x3A:0x3C])[0]
          s_shnum = struct.unpack('<H', stock_buf[0x3C:0x3E])[0]
          s_shstrndx = struct.unpack('<H', stock_buf[0x3E:0x40])[0]
          s_off = struct.unpack('<Q', stock_buf[s_shoff + s_shstrndx*s_shentsize + 0x18 : s_shoff + s_shstrndx*s_shentsize + 0x20])[0]
          s_str = stock_buf[s_off:]

          stock_versions = None
          for i in range(s_shnum):
              off = s_shoff + i*s_shentsize
              nidx = struct.unpack('<I', stock_buf[off:off+4])[0]
              if s_str[nidx:s_str.find(b'\x00', nidx)] == b'__versions':
                  sec_off = struct.unpack('<Q', stock_buf[off+0x18:off+0x20])[0]
                  sec_size = struct.unpack('<Q', stock_buf[off+0x20:off+0x28])[0]
                  stock_versions = stock_buf[sec_off:sec_off+sec_size]
                  break

          minimal_entry = None
          if stock_versions:
              for i in range(0, len(stock_versions), 64):
                  if stock_versions[i+8:i+64].split(b'\x00',1)[0] == b'module_layout':
                      minimal_entry = stock_versions[i:i+64]
                      break

          with open(ko_path, 'rb') as f: ko_data = bytearray(f.read())
          if ko_data[0:4] != b'\x7fELF': sys.exit('not ELF')

          shoff = struct.unpack('<Q', ko_data[0x28:0x30])[0]
          shentsize = struct.unpack('<H', ko_data[0x3A:0x3C])[0]
          shnum = struct.unpack('<H', ko_data[0x3C:0x3E])[0]
          shstrndx = struct.unpack('<H', ko_data[0x3E:0x40])[0]
          strtab_off = struct.unpack('<Q', ko_data[shoff + shstrndx*shentsize + 0x18 : shoff + shstrndx*shentsize + 0x20])[0]
          strtab = bytes(ko_data[strtab_off:])

          def get_name(idx):
              e = strtab.find(b'\x00', idx); return strtab[idx:e].decode(errors='ignore')

          modinfo_idx, versions_idx = -1, -1
          symtab_offset, symtab_size, symtab_entsize, strtab2 = 0,0,0,0
          ZERO = {'.altinstructions','.rela.altinstructions','__jump_table',
                  '.rela__jump_table','__patchable_function_entries',
                  '.rela__patchable_function_entries'}

          for i in range(shnum):
              off = shoff + i*shentsize
              name = get_name(struct.unpack('<I', ko_data[off:off+4])[0])
              sh_type = struct.unpack('<I', ko_data[off+4:off+8])[0]
              if name in ZERO:
                  ko_data[off+0x20:off+0x28] = struct.pack('<Q', 0)
              if name == '.modinfo':
                  modinfo_idx = i
                  modinfo_off = struct.unpack('<Q', ko_data[off+0x18:off+0x20])[0]
                  modinfo_size = struct.unpack('<Q', ko_data[off+0x20:off+0x28])[0]
              elif name == '__versions':
                  versions_idx = i
                  versions_sh_offset = off
              elif sh_type == SHT_SYMTAB:
                  symtab_offset = struct.unpack('<Q', ko_data[off+0x18:off+0x20])[0]
                  symtab_size = struct.unpack('<Q', ko_data[off+0x20:off+0x28])[0]
                  symtab_entsize = struct.unpack('<Q', ko_data[off+0x38:off+0x40])[0]
                  sidx = struct.unpack('<I', ko_data[off+0x28:off+0x2c])[0]
                  strtab2 = struct.unpack('<Q', ko_data[shoff + sidx*shentsize + 0x18 : shoff + sidx*shentsize + 0x20])[0]

          for i in range(symtab_size // symtab_entsize):
              sr = symtab_offset + i*symtab_entsize
              st_name = struct.unpack('<I', ko_data[sr:sr+4])[0]
              st_shndx = struct.unpack('<H', ko_data[sr+6:sr+8])[0]
              end = ko_data.find(b'\x00', strtab2 + st_name)
              name = ko_data[strtab2+st_name:end].decode(errors='ignore')
              if name == '____versions' and versions_idx != -1:
                  ko_data[sr+6:sr+8] = struct.pack('<H', versions_idx)
                  ko_data[sr+8:sr+16] = struct.pack('<Q', 0)
                  ko_data[sr+16:sr+24] = struct.pack('<Q', 64)
                  continue
              if st_shndx == SHN_UNDEF and not name.startswith('__kcfi_typeid_') and name in kallsyms:
                  ko_data[sr+6:sr+8] = struct.pack('<H', SHN_ABS)
                  ko_data[sr+8:sr+16] = struct.pack('<Q', kallsyms[name])

          modinfo_data = ko_data[modinfo_off:modinfo_off+modinfo_size]
          v_idx = modinfo_data.find(b'vermagic=')
          vs = v_idx + 9; ve = modinfo_data.find(b'\x00', vs)
          new_magic = b'6.6.127-android15-8-g1a9b880d342b-ab15218529-4k SMP preempt mod_unload modversions aarch64'
          new_modinfo = modinfo_data[:vs] + new_magic + modinfo_data[ve:]
          new_modinfo_off = len(ko_data); ko_data.extend(new_modinfo)
          ko_data[shoff+modinfo_idx*shentsize+0x18 : shoff+modinfo_idx*shentsize+0x20] = struct.pack('<Q', new_modinfo_off)
          ko_data[shoff+modinfo_idx*shentsize+0x20 : shoff+modinfo_idx*shentsize+0x28] = struct.pack('<Q', len(new_modinfo))

          if versions_idx != -1 and minimal_entry is not None:
              new_versions_off = len(ko_data); ko_data.extend(minimal_entry)
              ko_data[versions_sh_offset+0x18:versions_sh_offset+0x20] = struct.pack('<Q', new_versions_off)
              ko_data[versions_sh_offset+0x20:versions_sh_offset+0x28] = struct.pack('<Q', 64)

          with open('/data/local/tmp/kernelsu_patched.ko','wb') as f:
              f.write(ko_data)
          print('Success! KASLR addresses bound.')
          PATCH_FINAL_PY

      - name: Copy Harness Scripts & Matched ksud
        run: |
          set -euo pipefail
          B="$GITHUB_WORKSPACE/artifact_bundle"
          R="$GITHUB_WORKSPACE/workspace-repo"
          cp "$R/deploy.sh" "$B/deploy.sh"
          cp "$R/gen_allowlist.py" "$B/gen_allowlist.py"
          cp "$R/ksud" "$B/ksud"
          chmod +x "$B/deploy.sh" "$B/ksud"

      - name: Copy Exploit Binaries & Package
        run: |
          set -euo pipefail
          B="$GITHUB_WORKSPACE/artifact_bundle"
          
          for f in e-r20 spray stock.ko; do
            F=$(find "$GITHUB_WORKSPACE/workspace-repo" -name "$f" | head -n1)
            if [ -z "$F" ]; then
              echo "FATAL: Required binary '$f' not found in workspace-repo"
              exit 1
            fi
            cp "$F" "$B/$f"
            chmod +x "$B/$f"
          done

          cat > "$B/BUILD_INFO.txt" << BUILD_INFO_TXT
          BakaSU Ref      : ${BAKASU_REF}
          KMI Target      : ${KMI_GENERATION}
          Clang           : ${CLANG_REVISION}
          Debug Enabled   : CONFIG_KSU_DEBUG=y
          Timestamp       : $(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_INFO_TXT

