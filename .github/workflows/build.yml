name: Build KernelSU Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Nothing Kernel Source
      uses: actions/checkout@v4
      with:
        repository: 'NothingOSS/android_kernel_msm-6.6_nothing_sm7750'
        ref: 'sm7750/b/FroggerPro'
        path: 'kernel_source'
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev libelf-dev python3 unzip curl wget device-tree-compiler aria2 lld clang llvm

    - name: Sparse Clone Prebuilt Clang Toolchain (r510928)
      run: |
        mkdir -p $HOME/clang
        cd $HOME/clang
        git init
        git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
        git config core.sparseCheckout true
        echo "clang-r510928/*" >> .git/info/sparse-checkout
        git fetch --depth=1 origin main || git fetch --depth=1 origin master
        git checkout FETCH_HEAD

    - name: Integrate BakaSU
      working-directory: ./kernel_source
      run: |
        curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

    - name: Apply SAFE_LATE_LOAD Patch
      working-directory: ./kernel_source
      run: |
        cat > /tmp/patch_ksu.py << 'PYEOF'
        import sys
        from pathlib import Path

        def apply_patch():
            ksu_dir = Path("drivers/kernelsu").resolve()
            kconfig_path = ksu_dir / "Kconfig"
            initc_path = ksu_dir / "core" / "init.c"

            if not kconfig_path.exists():
                print(f"ERROR: Kconfig not found at {kconfig_path}!")
                sys.exit(1)
            if not initc_path.exists():
                print(f"ERROR: init.c not found at {initc_path}!")
                sys.exit(1)

            kconfig_text = kconfig_path.read_text()
            kconfig_anchor = 'menu "KernelSU"'
            if kconfig_anchor not in kconfig_text:
                print("ERROR: Could not find 'menu \"KernelSU\"' in Kconfig!")
                sys.exit(1)

            if "config KSU_SAFE_LATE_LOAD" not in kconfig_text:
                safe_config = (
                    'menu "KernelSU"\n\n'
                    'config KSU_SAFE_LATE_LOAD\n'
                    '\tbool "Safe late-load (skip aggressive init on OEM kernels)"\n'
                    '\tdepends on KSU\n'
                    '\tdefault y\n'
                    '\thelp\n'
                    '\t  When late-loading the LKM, skip cred mutation, SELinux domain\n'
                    '\t  escape, and full syscall-hook registration.\n'
                )
                kconfig_text = kconfig_text.replace(kconfig_anchor, safe_config, 1)
                kconfig_path.write_text(kconfig_text)
                print("Successfully patched Kconfig.")
            else:
                print("Kconfig already patched.")

            init_text = initc_path.read_text()
            anchor1 = 'pr_info("late load mode, skipping kprobe hooks\\n");'
            anchor2 = 'if (!getenforce()) {'

            if anchor1 not in init_text:
                print("ERROR: Could not find anchor1 in init.c!")
                sys.exit(1)
            if anchor2 not in init_text:
                print("ERROR: Could not find anchor2 in init.c!")
                sys.exit(1)

            if "SAFE_LATE_LOAD" not in init_text:
                patch1 = (
                    anchor1 + "\n"
                    "#ifdef CONFIG_KSU_SAFE_LATE_LOAD\n"
                    '\t\tpr_info("SAFE_LATE_LOAD: skipping rules/cred/escape/hook init\\n");\n'
                    "\t\tksu_boot_completed = true;\n"
                    "\t\tgoto safe_late_done;\n"
                    "#endif"
                )
                init_text = init_text.replace(anchor1, patch1, 1)

                patch2 = (
                    "#ifndef CONFIG_KSU_SAFE_LATE_LOAD\n"
                    "\t\t" + anchor2
                )
                init_text = init_text.replace(anchor2, patch2, 1)

                anchor3 = "setenforce(true);\n\t\t}"
                if anchor3 not in init_text:
                    anchor3 = "setenforce(true);\n        }"
                if anchor3 not in init_text:
                    print("ERROR: Could not find setenforce(true) block in init.c!")
                    sys.exit(1)

                init_text = init_text.replace(
                    anchor3,
                    anchor3 + "\n#endif\nsafe_late_done:\n\t\t;",
                    1
                )
                initc_path.write_text(init_text)
                print("Successfully patched init.c.")
            else:
                print("init.c already patched.")

        apply_patch()
        PYEOF
        python3 /tmp/patch_ksu.py

    - name: Create Dummy Module (For Kernel Stability Testing)
      working-directory: ./kernel_source
      run: |
        mkdir -p drivers/dummy_mod
        cat > drivers/dummy_mod/Makefile << 'EOF'
        obj-m := dummy.o
        EOF
        cat > drivers/dummy_mod/dummy.c << 'EOF'
        #include <linux/module.h>
        #include <linux/kernel.h>
        static int __init dummy_init(void) {
            pr_info("DUMMY: Successfully inserted dummy module!\n");
            return 0;
        }
        static void __exit dummy_exit(void) {
            pr_info("DUMMY: Removed dummy module.\n");
        }
        module_init(dummy_init);
        module_exit(dummy_exit);
        MODULE_LICENSE("GPL");
        EOF

    - name: Compile the Modules
      working-directory: ./kernel_source
      run: |
        export PATH="$HOME/clang/clang-r510928/bin:$PATH"
        export ARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        export READELF=llvm-readelf
        export HOSTCC=clang
        export HOSTLD=ld.lld

        echo "-android15-8-g1a9b880d342b-ab15218529-4k" > .scmversion
        sed -i '51,54d' include/trace/hooks/blk.h

        awk '!seen[$0]++ || !/EXPORT_TRACEPOINT_SYMBOL_GPL\(android_vh_bio_add_page_merge_bypass\)/' \
          drivers/android/vendor_hooks.c > drivers/android/vendor_hooks.c.tmp && \
          mv drivers/android/vendor_hooks.c.tmp drivers/android/vendor_hooks.c

        make gki_defconfig
        scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/FroggerPro.config

        scripts/config --enable CONFIG_MODULES
        scripts/config --set-val CONFIG_KSU m
        scripts/config --enable CONFIG_KSU_SAFE_LATE_LOAD
        scripts/config --disable CONFIG_LOCALVERSION_AUTO
        scripts/config --set-str CONFIG_LOCALVERSION ""
        scripts/config -d LTO_CLANG -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO

        make -j$(nproc) olddefconfig
        grep -q "CONFIG_KSU_SAFE_LATE_LOAD=y" .config || { echo "ERROR: SAFE_LATE_LOAD config failed to apply!"; exit 1; }

        make -j$(nproc) modules_prepare
        make -j$(nproc) security/selinux/built-in.a

        # Build Kernelsu
        KSU_DIR=$(realpath drivers/kernelsu)
        make -j$(nproc) M="$KSU_DIR" src="$KSU_DIR" \
          CONFIG_KSU=m \
          CONFIG_KSU_SAFE_LATE_LOAD=y \
          KCFLAGS="-DCONFIG_KSU_SAFE_LATE_LOAD=1" \
          KBUILD_MODPOST_WARN=1 \
          modules

        # Build Dummy
        make -j$(nproc) M=drivers/dummy_mod modules

        llvm-strip -d "$KSU_DIR/kernelsu.ko" || true
        llvm-strip -d "drivers/dummy_mod/dummy.ko" || true

        strings "$KSU_DIR/kernelsu.ko" | grep -q "SAFE_LATE_LOAD" || { echo "ERROR: SAFE_LATE_LOAD not found in compiled .ko!"; exit 1; }

        cp "$KSU_DIR/kernelsu.ko" ./kernelsu.ko
        cp "drivers/dummy_mod/dummy.ko" ./dummy.ko

        ls -lh ./kernelsu.ko ./dummy.ko

    - name: Upload Compiled Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: modules
        path: |
          kernel_source/kernelsu.ko
          kernel_source/dummy.ko