#new
name: Build KernelSU LKM (GKI 6.6 ABI-Safe)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (e.g., android16-6.6)'
        required: true
        default: 'android16-6.6'
        type: string
      ksu_ref:
        description: 'KernelSU/BakaSU branch or tag'
        required: true
        default: 'main'
        type: string

env:
  KSU_REPO: BakaSU/KernelSU
  CLANG_VERSION: r510928
  BUILD_TOOLS_VERSION: linux-x86

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout KernelSU (BakaSU)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KSU_REPO }}
          ref: ${{ inputs.ksu_ref }}
          path: KernelSU
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo bc cpio flex bison libssl-dev libelf-dev ccache python3 zip wget git

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 5G

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${CLANG_VERSION}.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Download AOSP Build-Tools
        run: |
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/build-tools/+archive/refs/heads/main/${BUILD_TOOLS_VERSION}.tar.gz -O build-tools.tar.gz
          mkdir -p build-tools
          tar -xzf build-tools.tar.gz -C build-tools
          rm build-tools.tar.gz

      - name: Sync AOSP Kernel Source
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_source
          cd $GITHUB_WORKSPACE/kernel_source
          
          repo init --depth=1 --u https://android.googlesource.com/kernel/manifest \
            -b common-${{ inputs.kernel_version }} --repo-rev=v2.16
          repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Integrate KernelSU and Dummy Module
        run: |
          cd $GITHUB_WORKSPACE/kernel_source
          
          # Link KernelSU Driver
          ln -sf $GITHUB_WORKSPACE/KernelSU/kernel common/drivers/kernelsu
          
          # Enable KernelSU in defconfig
          echo "CONFIG_KSU=y" >> common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_DEBUG=y" >> common/arch/arm64/configs/gki_defconfig
          
          # Create dummy module
          mkdir -p common/drivers/dummy_mod
          cat << 'EOF' > common/drivers/dummy_mod/Makefile
          obj-m += dummy.o
          EOF
          cat << 'EOF' > common/drivers/dummy_mod/dummy.c
          #include <linux/module.h>
          #include <linux/kernel.h>
          static int __init dummy_init(void) { printk(KERN_INFO "Dummy loaded\n"); return 0; }
          static void __exit dummy_exit(void) { printk(KERN_INFO "Dummy unloaded\n"); }
          module_init(dummy_init);
          module_exit(dummy_exit);
          MODULE_LICENSE("GPL");
          EOF

      - name: Apply ABI-Safe Header Patches (Python Regex - Grok Hardened)
        run: |
          cd $GITHUB_WORKSPACE/kernel_source/common
          
          python3 - << 'PY'
          import re
          import sys

          def patch_file(filepath, pattern, replacement, description):
              try:
                  with open(filepath, 'r') as f:
                      content = f.read()
                  
                  new_content, count = re.subn(pattern, replacement, content)
                  
                  if count == 0:
                      print(f"❌ ERROR: Failed to patch {description} in {filepath}")
                      sys.exit(1)
                      
                  with open(filepath, 'w') as f:
                      f.write(new_content)
                  print(f"✅ Successfully patched {description} in {filepath} (Count: {count})")
              except Exception as e:
                  print(f"❌ ERROR: Exception patching {filepath}: {e}")
                  sys.exit(1)

          # 1. Patch alternative-macros.h (Tightened regex for tab/whitespace)
          patch_file(
              "arch/arm64/include/asm/alternative-macros.h",
              r'ALTERNATIVE_CB\(\s*"b\s*%l\[l_no\]"\s*,\s*%\[cpucap\]\s*,\s*alt_cb_patch_nops\s*\)',
              'ALTERNATIVE("b %l[l_no]", "nop", %[cpucap])',
              "alternative-macros.h ALTERNATIVE_CB"
          )

          # 2. Patch barrier.h
          patch_file(
              "arch/arm64/include/asm/barrier.h",
              r'ALTERNATIVE_CB\(\s*"dsb sy"\s*,\s*ARM64_HAS_GIC_PRIO_RELAXED_SYNC\s*,\s*alt_cb_patch_nops\s*\)',
              'ALTERNATIVE("dsb sy", "nop", ARM64_HAS_GIC_PRIO_RELAXED_SYNC)',
              "barrier.h ALTERNATIVE_CB"
          )

          # 3. Patch jump_label.h
          patch_file(
              "include/linux/jump_label.h",
              r'static\s+__always_inline\s+bool\s+static_key_false\(struct static_key \*key\)',
              'static __always_inline bool __unused_jl_false(struct static_key *key)',
              "jump_label.h static_key_false rename"
          )
          patch_file(
              "include/linux/jump_label.h",
              r'static\s+__always_inline\s+bool\s+static_key_true\(struct static_key \*key\)',
              'static __always_inline bool __unused_jl_true(struct static_key *key)',
              "jump_label.h static_key_true rename"
          )
          
          # Append ABI-safe definitions
          with open("include/linux/jump_label.h", "a") as f:
              f.write("""
          /* ABI-safe redefinition: use count instead of jump table */
          static __always_inline bool static_key_false(struct static_key *key)
          {
              return unlikely(static_key_count(key) > 0);
          }
          static __always_inline bool static_key_true(struct static_key *key)
          {
              return likely(static_key_count(key) > 0);
          }
          """)
          print("✅ Appended ABI-safe static_key definitions.")
          PY

      - name: Build Kernel with AOSP build.sh
        run: |
          cd $GITHUB_WORKSPACE/kernel_source
          
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$GITHUB_WORKSPACE/toolchain/build-tools/linux-x86/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CCACHE_DIR=$GITHUB_WORKSPACE/.ccache
          export CC="ccache clang"
          
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Build External Modules (With KBUILD_EXTRA_SYMBOLS)
        run: |
          cd $GITHUB_WORKSPACE/kernel_source/common
          
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$GITHUB_WORKSPACE/toolchain/build-tools/linux-x86/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CCACHE_DIR=$GITHUB_WORKSPACE/.ccache
          export CC="ccache clang"
          
          # Grok's explicit Module.symvers fix
          SYMVERS=$(find $GITHUB_WORKSPACE/kernel_source/out -name Module.symvers | head -n 1)
          if [ -z "$SYMVERS" ]; then
              echo "❌ ERROR: Module.symvers not found!"
              exit 1
          fi
          echo "Using Module.symvers: $SYMVERS"
          export KBUILD_EXTRA_SYMBOLS="$SYMVERS"
          
          KSU_DIR=$GITHUB_WORKSPACE/KernelSU/kernel
          
          echo "Building KernelSU Module..."
          make -j$(nproc) M=$KSU_DIR \
            CFLAGS_MODULE="-mcmodel=large" \
            modules
          
          echo "Building Dummy Module..."
          make -j$(nproc) M=drivers/dummy_mod modules

      - name: Verify No Problematic Relocations
        run: |
          KO_FILE=$(find $GITHUB_WORKSPACE/KernelSU -name "kernelsu.ko" | head -n 1)
          echo "Checking: $KO_FILE"
          
          if llvm-readelf -r -S "$KO_FILE" | grep -E "alt_cb_patch_nops|__jump_table"; then
            echo "❌ ERROR: External PREL32 relocations still present in the compiled .ko!"
            exit 1
          else
            echo "✅ Success: No alt_cb_patch_nops or __jump_table found in the final binary."
          fi

      - name: Package Artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          cp $(find $GITHUB_WORKSPACE/KernelSU -name "kernelsu.ko" | head -n 1) $GITHUB_WORKSPACE/output/
          cp $(find $GITHUB_WORKSPACE/kernel_source/common/drivers/dummy_mod -name "dummy.ko" | head -n 1) $GITHUB_WORKSPACE/output/
          
          cd $GITHUB_WORKSPACE/output
          zip -r modulesNEWEST.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-modules-${{ inputs.kernel_version }}
          path: |
            ${{ github.workspace }}/output/modulesNEWEST.zip
          if-no-files-found: error