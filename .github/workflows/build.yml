name: Build KernelSU LKM (GKI 6.6 - ABI Safe)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (e.g., android16-6.6)'
        required: true
        default: 'android16-6.6'
        type: string
      ksu_ref:
        description: 'KernelSU branch or tag'
        required: true
        default: 'main'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout KernelSU
        uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: ${{ inputs.ksu_ref }}
          path: KernelSU
          fetch-depth: 0

      - name: Setup Kernel Source
        run: |
          sudo apt-get update
          sudo apt-get install -y repo bc cpio flex bison libssl-dev libelf-dev
          
          mkdir -p $GITHUB_WORKSPACE/android-kernel
          cd $GITHUB_WORKSPACE/android-kernel
          
          # Initialize repo for the specified kernel version
          repo init --depth=1 --u https://android.googlesource.com/kernel/manifest \
            -b common-${{ inputs.kernel_version }} --repo-rev=v2.16
          repo sync -c -j$(nproc --all) --no-tags

      - name: Integrate KernelSU Driver
        run: |
          cd $GITHUB_WORKSPACE/android-kernel
          # Link KernelSU driver into the kernel tree
          ln -sf $GITHUB_WORKSPACE/KernelSU/kernel common/drivers/kernelsu

      - name: Apply ABI-Safe Header Patches (Gemini Fix)
        run: |
          cd $GITHUB_WORKSPACE/android-kernel/common
          
          # ---------------------------------------------------------------
          # PATCH 1: Eliminate external PREL32 to alt_cb_patch_nops
          # Replace ALTERNATIVE_CB with local ALTERNATIVE (nop)
          # ---------------------------------------------------------------
          
          # Fix alternative-macros.h (for alternative_has_cap_likely)
          sed -i 's/ALTERNATIVE_CB("b %l\[l_no\]", %\[cpucap\], alt_cb_patch_nops)/ALTERNATIVE("b %l[l_no]", "nop", %[cpucap])/g' \
            arch/arm64/include/asm/alternative-macros.h
            
          # Fix barrier.h (for pmr_sync)
          sed -i 's/ALTERNATIVE_CB("dsb sy", ARM64_HAS_GIC_PRIO_RELAXED_SYNC, alt_cb_patch_nops)/ALTERNATIVE("dsb sy", "nop", ARM64_HAS_GIC_PRIO_RELAXED_SYNC)/g' \
            arch/arm64/include/asm/barrier.h

          # ---------------------------------------------------------------
          # PATCH 2: Eliminate __jump_table while preserving struct size
          # Rename original functions, redefine to use static_key_count
          # ---------------------------------------------------------------
          
          sed -i 's/static __always_inline bool static_key_false(struct static_key \*key)/static __always_inline bool __unused_jl_false(struct static_key *key)/' \
            include/linux/jump_label.h
          sed -i 's/static __always_inline bool static_key_true(struct static_key \*key)/static __always_inline bool __unused_jl_true(struct static_key *key)/' \
            include/linux/jump_label.h
            
          cat << 'EOF' >> include/linux/jump_label.h
/* ABI-safe redefinition: use count instead of jump table */
static __always_inline bool static_key_false(struct static_key *key)
{
	return unlikely(static_key_count(key) > 0);
}
static __always_inline bool static_key_true(struct static_key *key)
{
	return likely(static_key_count(key) > 0);
}
EOF

          # ---------------------------------------------------------------
          # PATCH 3: Ensure Kbuild does not regenerate autoconf.h mid-build
          # ---------------------------------------------------------------
          # We keep CONFIG_JUMP_LABEL=y (default GKI), so no change needed here.
          # The patches above are purely header-level (no ABI change).

      - name: Build KernelSU Module
        run: |
          cd $GITHUB_WORKSPACE/android-kernel/common
          
          # Set up the build environment
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          
          # Prepare kernel build (module build requires this)
          make gki_defconfig
          make modules_prepare -j$(nproc)
          
          # Build the module
          KSU_DIR=$GITHUB_WORKSPACE/KernelSU/kernel
          make -j$(nproc) M=$KSU_DIR modules

      - name: Verify No Problematic Relocations
        run: |
          KO_FILE=$(find $GITHUB_WORKSPACE/KernelSU -name "*.ko" | head -n 1)
          echo "Checking: $KO_FILE"
          
          # Verify no alt_cb_patch_nops or __jump_table relocations
          if llvm-readelf -r -S "$KO_FILE" | grep -E "alt_cb_patch_nops|__jump_table"; then
            echo "❌ ERROR: External PREL32 relocations still present!"
            exit 1
          else
            echo "✅ Success: No alt_cb_patch_nops or __jump_table found."
          fi
          
          # Verify struct static_key size (should be 16 bytes for GKI)
          # (This requires a small C program, but we rely on the header patch above.)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-modules-${{ inputs.kernel_version }}
          path: |
            ${{ github.workspace }}/KernelSU/**/*.ko
          if-no-files-found: error