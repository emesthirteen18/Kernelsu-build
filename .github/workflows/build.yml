name: Build KernelSU Module (NothingOSS ABI-Safe)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Nothing Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'NothingOSS/android_kernel_msm-6.6_nothing_sm7750'
          ref: 'sm7750/b/FroggerPro'
          path: 'kernel_source'
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc bison flex libssl-dev libelf-dev \
            python3 unzip curl wget device-tree-compiler aria2 pahole cpio

      - name: Download Prebuilt AOSP Clang Toolchain (r510928)
        run: |
          mkdir -p "$HOME/clang/clang-r510928"
          cd "$HOME/clang"
          echo "Downloading AOSP clang-r510928 archive..."
          curl -fLSs --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r510928/clang-r510928.tar.gz" \
            -o clang-r510928.tar.gz
          tar -xzf clang-r510928.tar.gz -C clang-r510928
          rm -f clang-r510928.tar.gz
          
          test -x "$HOME/clang/clang-r510928/bin/clang" || {
            echo "ERROR: clang binary missing or not executable!"
            exit 1
          }
          echo "$HOME/clang/clang-r510928/bin" >> "$GITHUB_PATH"
          "$HOME/clang/clang-r510928/bin/clang" --version

      - name: Integrate BakaSU
        working-directory: ./kernel_source
        run: |
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

      - name: Apply Unconditional SAFE_LATE_LOAD Patch
        working-directory: ./kernel_source
        run: |
          cat > /tmp/patch_ksu.py << 'PYEOF'
          import re
          import sys
          from pathlib import Path

          def apply_patch():
              ksu_link = Path("drivers/kernelsu")
              if not ksu_link.exists():
                  print("ERROR: drivers/kernelsu symlink does not exist!")
                  sys.exit(1)

              ksu_dir = ksu_link.resolve()
              print(f"[+] Resolved KSU directory: {ksu_dir}")

              candidates = [ksu_dir / "core" / "init.c", ksu_dir / "init.c"]
              initc_path = next((p for p in candidates if p.exists()), None)
              if initc_path is None:
                  print(f"ERROR: init.c not found in {candidates}!")
                  sys.exit(1)

              print(f"[+] Target init.c: {initc_path}")
              init_text = initc_path.read_text()

              if "SAFE_LATE_LOAD:" in init_text:
                  print("[+] init.c already contains SAFE_LATE_LOAD patch.")
                  return

              anchor1_pat = re.compile(
                  r'(pr_info\(\s*"late load mode, skipping kprobe hooks\\n"\s*\)\s*;)'
              )
              if not anchor1_pat.search(init_text):
                  print("ERROR: Could not find 'late load mode, skipping kprobe hooks' pr_info in init.c!")
                  sys.exit(1)

              selinux_block_pat = re.compile(
                  r'(if\s*\(\s*!getenforce\(\)\s*\)\s*\{[\s\S]*?setenforce\(\s*true\s*\)\s*;\s*\})'
              )
              if not selinux_block_pat.search(init_text):
                  print("ERROR: Could not find 'if (!getenforce()) { ... setenforce(true); }' block in init.c!")
                  sys.exit(1)

              init_text, n1 = anchor1_pat.subn(
                  r'\1\n'
                  r'\t\tpr_info("SAFE_LATE_LOAD: skipping rules/cred/escape/hook init\\n");\n'
                  r'\t\tksu_boot_completed = true;\n'
                  r'\t\tgoto safe_late_done;',
                  init_text,
                  count=1,
              )

              init_text, n2 = selinux_block_pat.subn(
                  r'#if 0 /* Disabled by SAFE_LATE_LOAD */\n\1\n#endif\n'
                  r'safe_late_done:\n\t\t;',
                  init_text,
                  count=1,
              )

              if n1 != 1 or n2 != 1:
                  print(f"ERROR: Unexpected replacement counts (n1={n1}, n2={n2})!")
                  sys.exit(1)

              initc_path.write_text(init_text)
              print("[+] Successfully patched init.c unconditionally for SAFE_LATE_LOAD.")

          apply_patch()
          PYEOF
          python3 /tmp/patch_ksu.py

      - name: Apply ABI-Safe Header Patches (Header-Order Safe READ_ONCE Fix)
        working-directory: ./kernel_source
        run: |
          python3 - << 'PY'
          import re, sys

          def patch_file(path, pat, repl, desc):
              with open(path, "r") as f:
                  content = f.read()
              new, n = re.subn(pat, repl, content)
              if n == 0:
                  print(f"ERROR: failed to patch {desc} in {path}")
                  sys.exit(1)
              with open(path, "w") as f:
                  f.write(new)
              print(f"patched {desc} ({n} occurrence(s))")

          patch_file(
              "arch/arm64/include/asm/alternative-macros.h",
              r'ALTERNATIVE_CB\([\s\\]*"b\s*%l\[l_no\]"[\s\\]*,[\s\\]*%\[cpucap\][\s\\]*,[\s\\]*alt_cb_patch_nops[\s\\]*\)',
              'ALTERNATIVE("b %l[l_no]", "nop", %[cpucap])',
              "ALTERNATIVE_CB"
          )

          patch_file(
              "arch/arm64/include/asm/barrier.h",
              r'ALTERNATIVE_CB\([\s\\]*"dsb sy"[\s\\]*,[\s\\]*ARM64_HAS_GIC_PRIO_RELAXED_SYNC[\s\\]*,[\s\\]*alt_cb_patch_nops[\s\\]*\)',
              'ALTERNATIVE("dsb sy", "nop", ARM64_HAS_GIC_PRIO_RELAXED_SYNC)',
              "barrier ALTERNATIVE_CB"
          )

          patch_file(
              "include/linux/jump_label.h",
              r'static __always_inline bool static_key_false\(struct static_key \*key\)\s*\{\s*return arch_static_branch\(key, false\);\s*\}',
              'static __always_inline bool static_key_false(struct static_key *key) { return unlikely(READ_ONCE(key->enabled.counter) > 0); }',
              "static_key_false body"
          )
          patch_file(
              "include/linux/jump_label.h",
              r'static __always_inline bool static_key_true\(struct static_key \*key\)\s*\{\s*return !arch_static_branch\(key, true\);\s*\}',
              'static __always_inline bool static_key_true(struct static_key *key) { return likely(READ_ONCE(key->enabled.counter) > 0); }',
              "static_key_true body"
          )
          patch_file(
              "include/linux/jump_label.h",
              r'!\s*arch_static_branch(?:_jump)?\(&\(x\)->key,\s*true\)',
              '(READ_ONCE((x)->key.enabled.counter) > 0)',
              "static_branch_likely arch_static_branch calls"
          )
          patch_file(
              "include/linux/jump_label.h",
              r'arch_static_branch(?:_jump)?\(&\(x\)->key,\s*false\)',
              '(READ_ONCE((x)->key.enabled.counter) > 0)',
              "static_branch_unlikely arch_static_branch calls"
          )
          print("injected in-place ABI-safe READ_ONCE static_key_* and static_branch_* overrides inside jump_label.h")
          PY

      - name: Create Dummy Module (For Kernel Stability Testing)
        working-directory: ./kernel_source
        run: |
          mkdir -p drivers/dummy_mod
          cat > drivers/dummy_mod/Makefile << 'EOF'
          obj-m := dummy.o
          EOF
          cat > drivers/dummy_mod/dummy.c << 'EOF'
          #include <linux/module.h>
          #include <linux/kernel.h>
          static int __init dummy_init(void) {
              pr_info("DUMMY: Successfully inserted dummy module!\n");
              return 0;
          }
          static void __exit dummy_exit(void) {
              pr_info("DUMMY: Removed dummy module.\n");
          }
          module_init(dummy_init);
          module_exit(dummy_exit);
          MODULE_LICENSE("GPL");
          EOF

      - name: Compile the Modules
        working-directory: ./kernel_source
        run: |
          set -euo pipefail

          export PATH="$HOME/clang/clang-r510928/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf
          export HOSTCC=clang
          export HOSTLD=ld.lld
          export KBUILD_MODPOST_WARN=1
          
          COMMON_WARN_FLAGS="-Wno-array-bounds -Wno-error=array-bounds -Wno-unreachable-code -Wno-unused-label -Wno-unused-function"
          export KCFLAGS="$COMMON_WARN_FLAGS"
          
          echo "-android15-8-g1a9b880d342b-ab15218529-4k" > .scmversion
          sed -i '51,54d' include/trace/hooks/blk.h
          
          awk '!seen[$0]++ || !/EXPORT_TRACEPOINT_SYMBOL_GPL\(android_vh_bio_add_page_merge_bypass\)/' \
            drivers/android/vendor_hooks.c > drivers/android/vendor_hooks.c.tmp && \
            mv drivers/android/vendor_hooks.c.tmp drivers/android/vendor_hooks.c
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/FroggerPro.config
          
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_MODULE_UNLOAD
          scripts/config --disable CONFIG_MODULE_SIG
          scripts/config --disable CONFIG_MODULE_SIG_FORCE
          scripts/config --disable CONFIG_WERROR
          scripts/config --set-val CONFIG_KSU m
          scripts/config --disable CONFIG_LOCALVERSION_AUTO
          scripts/config --set-str CONFIG_LOCALVERSION ""
          
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare KCFLAGS="$KCFLAGS"
          
          echo "[CHECK] .config & autoconf.h state ..."
          grep -q "^CONFIG_JUMP_LABEL=y" .config || {
            echo "ERROR: CONFIG_JUMP_LABEL=y missing from .config"
            exit 1
          }
          grep -q "#define CONFIG_JUMP_LABEL 1" include/generated/autoconf.h || {
            echo "ERROR: CONFIG_JUMP_LABEL missing from autoconf.h"
            exit 1
          }
          echo "[+] CONFIG_JUMP_LABEL verified in both .config and autoconf.h"
          
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 security/selinux/built-in.a KCFLAGS="$KCFLAGS"
          touch Module.symvers
          
          KSU_DIR=$(realpath drivers/kernelsu)
          echo "[+] Building KernelSU module from: $KSU_DIR"
          
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 M="$KSU_DIR" clean
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            M="$KSU_DIR" src="$KSU_DIR" \
            CONFIG_KSU=m \
            KCFLAGS="$KCFLAGS -DCONFIG_KSU_SAFE_LATE_LOAD=1" \
            CFLAGS_MODULE="-mcmodel=large $COMMON_WARN_FLAGS -DCONFIG_KSU_SAFE_LATE_LOAD=1" \
            KBUILD_MODPOST_WARN=1 \
            modules
          
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            M=drivers/dummy_mod \
            CFLAGS_MODULE="-mcmodel=large $COMMON_WARN_FLAGS" \
            KCFLAGS="$KCFLAGS" \
            modules
          
          BUILT_KSU_KO=$(find "$KSU_DIR" -maxdepth 2 -name "kernelsu*.ko" | head -n 1)
          if [ -z "$BUILT_KSU_KO" ] || [ ! -f "$BUILT_KSU_KO" ]; then
            echo "ERROR: No kernelsu*.ko found under $KSU_DIR!"
            exit 1
          fi
          echo "[+] Built module located at: $BUILT_KSU_KO"
          
          llvm-strip -d "$BUILT_KSU_KO"
          llvm-strip -d "drivers/dummy_mod/dummy.ko"
          
          echo "[CHECK] PREL32 relocations (alt_cb_patch_nops) ..."
          if llvm-readelf -rW "$BUILT_KSU_KO" | grep -q "alt_cb_patch_nops"; then
            echo "ERROR: alt_cb_patch_nops relocation still present!"
            exit 1
          fi
          echo "[+] No PREL32 alt_cb_patch_nops relocations."
          
          echo "[CHECK] __jump_table section ..."
          if llvm-readelf -SW "$BUILT_KSU_KO" | grep -q "__jump_table"; then
            echo "ERROR: __jump_table section still present!"
            exit 1
          fi
          echo "[+] No __jump_table section."
          
          echo "[CHECK] SAFE_LATE_LOAD string presence in final .ko ..."
          if ! llvm-strings "$BUILT_KSU_KO" | grep -q "SAFE_LATE_LOAD: skipping rules/cred/escape/hook init"; then
            echo "ERROR: SAFE_LATE_LOAD string missing from $BUILT_KSU_KO!"
            exit 1
          fi
          echo "[+] Verified SAFE_LATE_LOAD string is compiled into $BUILT_KSU_KO!"
          
          echo "[CHECK] vermagic & module metadata ..."
          llvm-strings "$BUILT_KSU_KO" | grep -E "^vermagic=" || true
          
          cp "$BUILT_KSU_KO" ./kernelsu.ko
          cp "drivers/dummy_mod/dummy.ko" ./dummy.ko
          ls -lh ./kernelsu.ko ./dummy.ko

      - name: Upload Compiled Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modulesNEWEST
          if-no-files-found: error
          path: |
            kernel_source/kernelsu.ko
            kernel_source/dummy.ko