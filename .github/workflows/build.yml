name: Build KernelSU Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Nothing Kernel Source
      uses: actions/checkout@v4
      with:
        repository: 'NothingOSS/android_kernel_msm-6.6_nothing_sm7750'
        path: 'kernel_source'
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev libelf-dev python3 unzip curl wget device-tree-compiler aria2 lld clang llvm

    - name: Sparse Clone Prebuilt Clang Toolchain (r510928)
      run: |
        mkdir -p $HOME/clang
        cd $HOME/clang
        git init
        git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
        git config core.sparseCheckout true
        echo "clang-r510928/*" >> .git/info/sparse-checkout
        git fetch --depth=1 origin master
        git checkout master

    - name: Integrate BakaSU
      working-directory: ./kernel_source
      run: |
        curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

    - name: Apply SAFE_LATE_LOAD Patch (Grok's Fix)
      working-directory: ./kernel_source
      run: |
        python3 - << 'PYEOF'
        import re
        from pathlib import Path

        # 1. Patch Kconfig
        kconfig = Path("KernelSU/kernel/Kconfig")
        text = kconfig.read_text()
        safe_config = """
config KSU_SAFE_LATE_LOAD
	bool "Safe late-load (skip aggressive init on non-GKI)"
	depends on KSU && KSU_TRACEPOINT_HOOK
	default n
	help
	  When late-loading the LKM, skip cred mutation, SELinux domain
	  escape, and full syscall-hook registration. Lets the module
	  load on kernels whose struct offsets / tracepoints diverge
	  from pure GKI (e.g. Nothing OS 4.1 / SM7750).

config KSU_MANUAL_HOOK"""
        text = text.replace("config KSU_MANUAL_HOOK", safe_config)
        kconfig.write_text(text)

        # 2. Patch init.c
        initc = Path("KernelSU/kernel/core/init.c")
        text = initc.read_text()
        
        # Add the early jump
        anchor1 = 'pr_info("late load mode, skipping kprobe hooks\\n");'
        patch1 = anchor1 + """
#ifdef CONFIG_KSU_SAFE_LATE_LOAD
		pr_info("SAFE_LATE_LOAD: skipping rules/cred/escape/hook init\\n");
		ksu_boot_completed = true;
		goto safe_late_done;
#endif"""
        text = text.replace(anchor1, patch1)
        
        # Add the label
        anchor2 = 'if (!getenforce()) {'
        patch2 = anchor2 + """
safe_late_done:"""
        text = text.replace(anchor2, patch2)
        initc.write_text(text)
        print("Successfully applied SAFE_LATE_LOAD patch.")
        PYEOF

    - name: Compile the Module (Fast Targeted LKM Build)
      working-directory: ./kernel_source
      run: |
        export PATH="$HOME/clang/clang-r510928/bin:$PATH"
        export ARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        export READELF=llvm-readelf
        export HOSTCC=clang
        export HOSTLD=ld.lld

        # Force exact vermagic localversion (Fixes the -dirty/+ issue)
        echo "-android15-8-g1a9b880d342b-ab15218529-4k" > .scmversion

        # Kill the duplicate DECLARE_HOOK in include/trace/hooks/blk.h
        sed -i '51,54d' include/trace/hooks/blk.h
        awk '!seen[$0]++ || !/EXPORT_TRACEPOINT_SYMBOL_GPL\(android_vh_bio_add_page_merge_bypass\)/' \
          drivers/android/vendor_hooks.c > drivers/android/vendor_hooks.c.tmp && \
          mv drivers/android/vendor_hooks.c.tmp drivers/android/vendor_hooks.c

        make gki_defconfig
        scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/FroggerPro.config

        scripts/config --enable CONFIG_MODULES
        scripts/config --set-val CONFIG_KSU m
        scripts/config --enable CONFIG_KSU_TRACEPOINT_HOOK
        scripts/config --enable CONFIG_KSU_SAFE_LATE_LOAD
        scripts/config --disable CONFIG_LOCALVERSION_AUTO
        scripts/config --set-str CONFIG_LOCALVERSION ""
        scripts/config -d LTO_CLANG -e LTO_NONE

        make -j$(nproc) olddefconfig
        make -j$(nproc) modules_prepare
        make -j$(nproc) security/selinux/built-in.a

        # Compile ONLY the BakaSU/KernelSU module directory
        KSU_DIR=$(realpath drivers/kernelsu)
        make -j$(nproc) M="$KSU_DIR" src="$KSU_DIR" \
          CONFIG_KSU=m \
          KBUILD_MODPOST_WARN=1 \
          modules

        llvm-strip -d "$KSU_DIR/kernelsu.ko" || true
        ls -lh "$KSU_DIR/kernelsu.ko"

    - name: Upload Compiling Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernelsu-module
        path: kernel_source/drivers/kernelsu/kernelsu.ko